<!doctype html>

<title>Predictionary</title>
<style>
  :root { --ink: #2b2350; --muted: #6c6591; --accent: #7b4dff; --accent-dark: #5a2fd6; --pink: #ff5fa2;
          --yellow: #ffc93c; --teal: #1fb89c; --blue: #3fa9ff; --orange: #ff8a3d; --card: #fff; --line: #e6ddff;
          --round: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Varela Round", "Nunito", system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; color: var(--ink); }
  body { font-family: var(--round); min-height: 100vh; background: #fff6d9; }
  body::before, body::after { content: ""; position: fixed; inset: -60px; z-index: -1; pointer-events: none; }
  body::before {
    background:
      radial-gradient(circle at 8% 12%, rgba(255, 201, 60, .45) 0 14px, transparent 15px),
      radial-gradient(circle at 15% 70%, rgba(63, 169, 255, .25) 0 18px, transparent 19px),
      radial-gradient(circle at 55% 50%, rgba(123, 77, 255, .12) 0 10px, transparent 11px),
      radial-gradient(circle at 70% 8%, rgba(31, 184, 156, .2) 0 9px, transparent 10px),
      radial-gradient(circle at 30% 38%, rgba(255, 138, 61, .22) 0 12px, transparent 13px),
      radial-gradient(circle at 78% 58%, rgba(63, 169, 255, .2) 0 16px, transparent 17px),
      radial-gradient(circle at 5% 92%, rgba(255, 95, 162, .22) 0 20px, transparent 21px),
      radial-gradient(circle at 62% 78%, rgba(255, 201, 60, .35) 0 7px, transparent 8px),
      radial-gradient(circle at 45% 6%, rgba(255, 95, 162, .2) 0 11px, transparent 12px),
      linear-gradient(180deg, #fff6d9 0%, #ffe9f3 45%, #e3f4ff 100%);
    animation: drift-a 7s ease-in-out infinite alternate; }
  body::after {
    background:
      radial-gradient(circle at 92% 30%, rgba(255, 95, 162, .25) 0 22px, transparent 23px),
      radial-gradient(circle at 85% 85%, rgba(31, 184, 156, .25) 0 26px, transparent 27px),
      radial-gradient(circle at 35% 90%, rgba(255, 201, 60, .3) 0 12px, transparent 13px),
      radial-gradient(circle at 40% 25%, rgba(255, 95, 162, .15) 0 8px, transparent 9px),
      radial-gradient(circle at 20% 50%, rgba(123, 77, 255, .16) 0 15px, transparent 16px),
      radial-gradient(circle at 88% 5%, rgba(255, 201, 60, .35) 0 10px, transparent 11px),
      radial-gradient(circle at 68% 40%, rgba(31, 184, 156, .18) 0 6px, transparent 7px),
      radial-gradient(circle at 12% 30%, rgba(63, 169, 255, .2) 0 7px, transparent 8px),
      radial-gradient(circle at 50% 66%, rgba(255, 138, 61, .18) 0 18px, transparent 19px);
    animation: drift-b 9s ease-in-out infinite alternate; }
  header { padding: calc(env(safe-area-inset-top) + .75rem) 1rem .5rem; display: flex; flex-wrap: wrap; align-items: flex-start;

  h1 { margin: 0; font: 900 clamp(1.45rem, 6.4vw, 2.1rem) var(--round); letter-spacing: -.5px; display: flex; align-items: center; gap: .3rem; }
  h1 .title { background: linear-gradient(90deg, var(--pink), var(--orange), var(--yellow), var(--teal), var(--blue), var(--accent));
              -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mascot { display: inline-block; font-size: .95em; animation: bob 2.6s ease-in-out infinite; }
  header p { margin: .15rem 0 0; color: var(--muted); font: 600 .95rem var(--round); }
  .lang { display: flex; gap: .15rem; background: #fff; border-radius: 999px; padding: .2rem; flex-shrink: 0;
          margin: .3rem 0 0 auto; box-shadow: 0 4px 0 var(--line); }
  .lang button { border: 0; background: transparent; color: var(--accent); padding: .3rem .5rem; border-radius: 999px;
                 font: 800 .8rem var(--round); }
  .lang button.on { background: var(--accent); color: #fff; }
  .tag { font: 800 .65rem var(--round); color: var(--accent); background: #f1ecff; border-radius: 999px;
         padding: .05rem .4rem; margin-left: .4rem; vertical-align: middle; }
  main { padding: .5rem 1rem calc(env(safe-area-inset-bottom) + 6rem); }
  .tab { display: none; }
  .tab.active { display: block; }
  .card { background: var(--card); border-radius: 24px; padding: 1rem 1.1rem; border: 3px solid var(--line);
          box-shadow: 0 6px 0 var(--line); }
  label { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .55rem 0;
          font: 700 1rem var(--round); color: var(--ink); border-bottom: 2px dashed var(--line); }
  input, select { font: 600 16px var(--round); padding: .5rem .7rem; border: 3px solid var(--line);
                  border-radius: 14px; background: #fff; color: var(--ink); outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  input[type=number] { width: 4.8rem; text-align: right; }
  #concept, #define-word { width: 100%; margin-bottom: .75rem; }
  button.go { width: 100%; background: linear-gradient(135deg, var(--pink), var(--accent)); color: #fff; border: 0;
              border-radius: 20px; padding: 1rem; font: 900 1.2rem var(--round); margin-top: .75rem;
              box-shadow: 0 6px 0 var(--accent-dark), 0 12px 22px rgba(123, 77, 255, .28);
              transition: transform .08s, box-shadow .08s; }
  button.go:disabled { opacity: .5; }
  button.go:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--accent-dark); }
  #predict-go::before { content: "🪄 "; }
  #invent-go::before { content: "🎲 "; }
  #coin-go::before { content: "🪙 "; }
  #define-go::before { content: "🔍 "; }
  #export::before { content: "📦 "; }
  #predict-go:not(:disabled) { animation: glow 2.4s ease-in-out infinite; }
  .hint { color: var(--muted); font: 600 .95rem var(--round); margin: .25rem 0 .75rem; }
  #status::before { content: "📚 "; }
  ol { list-style: none; padding: 0; margin: 1.1rem 0 0; }
  li.entry { --c: #ffc2dc; background: var(--card); border-radius: 24px; padding: 1rem 1.1rem; margin-bottom: 1rem;
             border: 3px solid var(--c); box-shadow: 0 6px 0 var(--c); display: grid; grid-template-columns: 1fr auto;
             gap: .75rem; animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; }
  li.entry:nth-child(4n+2) { --c: #bfe3ff; }
  li.entry:nth-child(4n+3) { --c: #c4f0e4; }
  li.entry:nth-child(4n+4) { --c: #ffe39a; }
  li.entry:nth-child(2) { animation-delay: .05s; } li.entry:nth-child(3) { animation-delay: .1s; }
  li.entry:nth-child(4) { animation-delay: .15s; } li.entry:nth-child(n+5) { animation-delay: .2s; }
  li.hint { text-align: center; }
  .word { font: 900 1.55rem var(--round); word-break: break-word; color: var(--accent); }
  #predict-out .word { font-size: clamp(1.5rem, 7.6vw, 2.4rem); line-height: 1.15;
    background: linear-gradient(90deg, var(--pink), var(--accent) 60%, var(--blue));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .predict-row { display: flex; flex-wrap: wrap; gap: 0 .6rem; }
  .predict-row button.go { flex: 1 0 100%; order: -1; white-space: nowrap; }
  button.step { flex: 1; margin-top: .9rem; padding: .5rem .9rem; border: 3px solid var(--line); border-radius: 18px;

                transition: transform .08s, box-shadow .08s; }
  button.step:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  button.step:disabled { opacity: .35; }
  .styles { display: flex; flex-wrap: wrap; gap: .45rem; justify-content: center; margin-top: 1rem; }
  .styles button { --c: var(--accent); border: 3px solid var(--c); background: #fff; color: var(--c); border-radius: 999px;
                   padding: .35rem .85rem; font: 800 .9rem var(--round); transition: transform .15s; }
  .styles button.on { background: var(--c); color: #fff; transform: scale(1.08) rotate(-2deg); }
  .styles [data-style=everyday] { --c: var(--orange); }
  .styles [data-style=classic] { --c: var(--teal); }
  .styles [data-style=scientific] { --c: var(--blue); }
  .styles [data-style=children] { --c: var(--pink); }
  .styles [data-style=everyday]::before { content: "☕ "; }
  .styles [data-style=classic]::before { content: "📜 "; }
  .styles [data-style=scientific]::before { content: "🔬 "; }
  .styles [data-style=children]::before { content: "🧸 "; }
  .pos { font: 800 .8rem var(--round); color: var(--accent); -webkit-text-fill-color: var(--accent); background: #f1ecff;
         border-radius: 999px; padding: .1rem .5rem; margin-left: .45rem; vertical-align: middle; }
  .def { font: 700 1.1rem var(--round); margin-top: .35rem; color: var(--ink); }
  .def[contenteditable] { outline: none; border-bottom: 2px dashed var(--line); }
  .def[contenteditable]:empty::before { content: attr(data-ph); color: #bbb; }
  .example { margin: .6rem 0 .35rem; padding: .55rem .8rem; background: #fff7d6; border-radius: 16px 16px 16px 4px;
             font: 600 .98rem var(--round); color: #5b4a1a; }
  .example::before { content: "💬 \201C"; }
  .example::after { content: "\201D"; }
  .entry:lang(fr) .example::before { content: "💬 \AB\A0"; }
  .entry:lang(fr) .example::after { content: "\A0\BB"; }
  .entry:lang(es) .example::before { content: "💬 \AB"; }
  .entry:lang(es) .example::after { content: "\BB"; }
  .recipe { display: inline-block; font: 700 .78rem var(--round); color: #138a73; background: #e3f8f2;
            border-radius: 999px; padding: .15rem .65rem; margin-top: .35rem; }
  .recipe::before { content: "🧪 "; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: .55rem; }
  .bar { height: 10px; background: #f1ecff; border-radius: 999px; width: 4.5rem; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 999px;
               background: linear-gradient(90deg, var(--pink), var(--yellow), var(--teal), var(--blue)); }
  .icon-btn { background: none; border: 0; font-size: 2rem; padding: 0; color: #e2dcf5; line-height: 1;
              transition: transform .2s cubic-bezier(.2, 1.6, .4, 1); }
  .icon-btn.on { color: var(--yellow); transform: scale(1.2) rotate(15deg); text-shadow: 0 2px 0 #e0a800; }
  .share { font-size: 1.3rem; color: var(--accent); }
  nav { position: fixed; left: .5rem; right: .5rem; bottom: calc(env(safe-area-inset-bottom) + .4rem); display: flex;

        border: 3px solid var(--line); border-radius: 26px; box-shadow: 0 6px 0 var(--line), 0 10px 24px rgba(43, 35, 80, .12); }
  nav button { flex: 1; background: none; border: 0; padding: .45rem 0 .4rem; color: var(--muted);
               font: 800 .72rem var(--round); }
  nav button span { display: inline-block; font-size: 1.5rem; padding: .05rem .6rem; border-radius: 16px;
                    transition: transform .2s cubic-bezier(.2, 1.6, .4, 1); }
  nav button em { display: block; font-style: normal; }
  nav button.active { color: var(--accent); }
  nav button.active span { background: #f1ecff; transform: translateY(-3px) scale(1.12); }
  #status { text-align: center; }
  li.hint a { color: var(--accent); font-weight: 800; }
  .confetti { position: fixed; z-index: 10; pointer-events: none; font-size: 1.4rem;
              animation: fly .95s ease-out forwards; }
  @keyframes pop { 0% { transform: scale(.6) rotate(-4deg); opacity: 0; } 60% { transform: scale(1.04) rotate(1deg); opacity: 1; }
                   100% { transform: none; } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-4px) rotate(6deg); } }
  @keyframes glow { 0%, 100% { filter: none; } 50% { filter: brightness(1.12) saturate(1.15); } }
  @keyframes drift-a { 0% { transform: translate(0, 0); } 50% { transform: translate(28px, -34px); }
                       100% { transform: translate(-22px, 26px); } }
  @keyframes drift-b { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-30px, 28px) scale(1.04); }
                       100% { transform: translate(24px, -22px) scale(.97); } }
  @keyframes fly { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
                   100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div>
    <h1><span class="mascot" aria-hidden="true">🦉</span><span class="title">Predictionary</span></h1>
    <p data-i18n="tagline">A dictionary of words that don't exist ... yet!</p>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en" class="on">EN</button>
    <button data-lang="fr">FR</button>
    <button data-lang="es">ES</button>
  </div>
</header>

<main>
  <p class="hint" id="status">Learning English…</p>

  <section class="tab active" id="tab-predict">
    <div class="predict-row">
      <button class="step" id="predict-prev" disabled data-i18n="prev">‹ Previous</button>
      <button class="go" id="predict-go" disabled data-i18n="predict">Predict a word</button>
      <button class="step" id="predict-next" disabled data-i18n="next">Next ›</button>
    </div>
    <div class="styles" role="group" aria-label="Style">
      <button data-style="everyday" data-i18n="styleEveryday">Everyday</button>
      <button data-style="classic" data-i18n="styleClassic">Classic</button>
      <button data-style="scientific" data-i18n="styleScientific">Scientific</button>
      <button data-style="children" data-i18n="styleChildren">Children</button>
    </div>
    <ol id="predict-out"></ol>
  </section>

  <section class="tab" id="tab-invent">
    <div class="card">
      <label><span data-i18n="howMany">How many</span> <input id="n" type="number" value="10" min="1" max="50" inputmode="numeric"></label>
      <label><span data-i18n="shortest">Shortest</span> <input id="min" type="number" value="5" min="3" max="20" inputmode="numeric"></label>
      <label><span data-i18n="longest">Longest</span> <input id="max" type="number" value="10" min="3" max="24" inputmode="numeric"></label>
      <label><span data-i18n="startsWith">Starts with</span> <input id="start" maxlength="10" size="8" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <label><span data-i18n="creativity">Creativity</span>
        <select id="creativity">
          <option value="tame" data-i18n="tame">tame</option>
          <option value="balanced" selected data-i18n="balanced">balanced</option>
          <option value="wild" data-i18n="wild">wild</option>
        </select>
      </label>
      <button class="go" id="invent-go" disabled data-i18n="invent">Invent</button>
    </div>
    <ol id="invent-out"></ol>
  </section>

  <section class="tab" id="tab-coin">
    <div class="card">
      <p class="hint" data-i18n="coinHint">Describe a concept, get candidate words for it. Try "fear of meetings" or "love of coffee".</p>
      <input id="concept" maxlength="200" placeholder="a concept that needs a word" enterkeyhint="go">
      <button class="go" id="coin-go" disabled data-i18n="coin">Coin</button>
    </div>
    <ol id="coin-out"></ol>
  </section>

  <section class="tab" id="tab-define">
    <div class="card">
      <p class="hint" data-i18n="defineHint">Type a word that doesn't exist and find out what it means.</p>
      <input id="define-word" maxlength="30" placeholder="a made-up word" enterkeyhint="go"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="go" id="define-go" disabled data-i18n="define">Define</button>
    </div>
    <ol id="define-out"></ol>
  </section>

  <section class="tab" id="tab-saved">
    <ol id="saved"></ol>
    <button class="go" id="export" data-i18n="export">Export as JSON</button>
  </section>
</main>

<nav>
  <button data-tab="predict" class="active"><span>✨</span><em data-i18n="navPredict">Predict</em></button>
  <button data-tab="invent"><span>🎲</span><em data-i18n="navInvent">Invent</em></button>
  <button data-tab="coin"><span>🪙</span><em data-i18n="navCoin">Coin</em></button>
  <button data-tab="define"><span>🔍</span><em data-i18n="navDefine">Define</em></button>
  <button data-tab="saved"><span>★</span><em id="nav-saved">Saved</em></button>
</nav>

<script src="engine.js"></script>
<script src="lang-fr.js"></script>
<script src="lang-es.js"></script>

    loadError: 'No se pudo cargar la lista de palabras ({e}).', writeDef: 'toca para escribir una definición',
    sounds: 'suena español al {n} %', save: 'Guardar', share: 'Compartir',
    navDefine: 'Definir', define: 'Definir', defineHint: 'Escribe una palabra que no exista y descubre qué significa.',
    definePh: 'una palabra inventada', defineEmpty: 'Escribe primero una palabra.', realWord: '«{w}» ya es una palabra real.',
    lookUp: 'Verla en Wikcionario',
    styleEveryday: 'Cotidiano', styleClassic: 'Clásico', styleScientific: 'Científico', styleChildren: 'Niños',
  },
};
const userLang = (navigator.language || '').slice(0, 2);
let lang = localStorage.getItem(LANG_KEY) || (['fr', 'es'].includes(userLang) ? userLang : 'en');
const t = key => STRINGS[lang][key];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

const store = () => localStorage.setItem(KEY, JSON.stringify(saved));
const langOf = x => x.lang || 'en'; // words saved before French existed are English
const isSaved = x => saved.some(s => s.word === x.word && langOf(s) === langOf(x));
const shareText = x => [`${x.word}${x.pos ? ` (${x.pos})` : ''}`, x.definition, x.example && `"${x.example}"`]
  .filter(Boolean).join('\n');

function row(x, editable) {
  const li = el('li', 'entry');
  li.lang = langOf(x);
  const body = el('div');
  const word = el('div', 'word', x.word);
  if (x.pos) word.append(el('span', 'pos', x.pos));
  if (editable) word.append(el('span', 'tag', langOf(x).toUpperCase()));
  body.append(word);
  const def = el('div', 'def', x.definition);
  if (editable) {
    def.contentEditable = 'true';
    def.dataset.ph = t('writeDef');
    def.onblur = () => { x.definition = def.textContent.trim(); store(); };
  }
  body.append(def);
  if (x.example) body.append(el('div', 'example', x.example));
  if (x.recipe) body.append(el('div', 'recipe', x.recipe));

  const side = el('div', 'side');
  const star = el('button', 'icon-btn', '★');
  star.classList.toggle('on', isSaved(x));
  star.setAttribute('aria-label', t('save'));
  star.onclick = () => { toggle(x); star.classList.toggle('on', isSaved(x)); };
  side.append(star);
  if (navigator.share) {
    const share = el('button', 'icon-btn share', '⤴');
    share.setAttribute('aria-label', t('share'));
    share.onclick = () => navigator.share({ text: shareText(x) }).catch(() => {});
    side.append(share);
  }
  const bar = el('div', 'bar');
  const fill = el('div');
  fill.style.width = x.plausibility + '%';
  bar.append(fill);
  bar.title = STRINGS[langOf(x)].sounds.replace('{n}', x.plausibility);
  side.append(bar);

  li.append(body, side);
  return li;
}

function render(list, entries, emptyMsg, editable = false, note = '') {
  list.replaceChildren();
  if (!entries.length) { list.append(el('li', 'hint', emptyMsg)); return; }
  for (const x of entries) list.append(row(x, editable));
  if (note) list.append(el('li', 'hint', note));
}

function toggle(x) {
  saved = isSaved(x)
    ? saved.filter(s => !(s.word === x.word && langOf(s) === langOf(x)))
    : [...saved, { ...x, saved: new Date().toISOString() }];
  store();
  renderSaved();
}

function renderSaved() {
  $('nav-saved').textContent = `${t('navSaved')} (${saved.length})`;
  const sorted = [...saved].sort((a, b) => a.word.localeCompare(b.word));
  render($('saved'), sorted, t('savedEmpty'), true);
}

document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === `tab-${b.dataset.tab}`));
  };
});

const num = (id, lo, hi, dflt) => Math.max(lo, Math.min(hi, parseInt($(id).value, 10) || dflt));
const wiktionary = l => `https://${l}.wiktionary.org/w/api.php?action=query&format=json&formatversion=2&origin=*&titles=`;

/** Ask Wiktionary (50 titles per request) which words already have a page. Returns { exists: Set, offline: bool }. */
async function checkOnline(words, l) {
  let offline = false;
  const todo = [...new Set(words.filter(w => !checked.has(`${l}:${w}`)))];
  for (let i = 0; i < todo.length; i += 50) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 5000);
    try {
      const r = await fetch(wiktionary(l) + encodeURIComponent(todo.slice(i, i + 50).join('|')), { signal: ctl.signal });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      for (const page of (await r.json()).query.pages) checked.set(`${l}:${page.title}`, !page.missing && !page.invalid);
    } catch {
      offline = true;
    } finally {
      clearTimeout(timer);
    }
  }
  const exists = new Set(words.filter(w => checked.get(`${l}:${w}`)));
  if (exists.size) {
    engine.addKnown(exists);
    const known = new Set([...JSON.parse(localStorage.getItem(knownKey(l)) || '[]'), ...exists]);
    localStorage.setItem(knownKey(l), JSON.stringify([...known].slice(-5000)));
  }
  return { exists, offline };
}

/** Keep only entries that are new according to Wiktionary too, tagged with their language. */
async function onlyNew(entries, n) {
  const l = lang;
  const { exists, offline } = await checkOnline(entries.map(x => x.word), l);
  return { fresh: entries.filter(x => !exists.has(x.word)).slice(0, n).map(x => ({ ...x, lang: l })), offline };
}

function busy(list, on) {
  if (on) list.replaceChildren(el('li', 'hint', t('checking')));
  document.querySelectorAll('button.go').forEach(b => { b.disabled = on; });
}

const predictions = { en: { list: [], shown: -1 }, fr: { list: [], shown: -1 }, es: { list: [], shown: -1 } };
const hist = () => predictions[lang];

function updateSteps(disable = false) {
  $('predict-prev').disabled = disable || hist().shown <= 0;
  $('predict-next').disabled = disable || hist().shown >= hist().list.length - 1;
}

function showPredicted(note = '') {
  const h = hist();
  if (h.shown < 0) $('predict-out').replaceChildren();
  else render($('predict-out'), [h.list[h.shown]], '', false, note);
  updateSteps();
}

$('predict-go').onclick = async () => {
  const out = $('predict-out');
  busy(out, true);
  updateSteps(true);
  let result = { fresh: [], offline: false };
  for (let i = 0; i < 6 && !result.fresh.length; i++) result = await onlyNew([engine.predict(style)], 1);
  localStorage.setItem(memoryKey(lang), JSON.stringify(engine.memory));
  busy(out, false);
  if (!result.fresh.length) {
    render(out, [], t('allExisted'));
    updateSteps();
    return;
  }
  const h = hist();
  h.list.push(result.fresh[0]);
  if (h.list.length > 50) h.list.shift();
  h.shown = h.list.length - 1;
  showPredicted(result.offline ? t('offline') : '');
  confetti($('predict-go'));
};

/** A small burst of emoji from the button; skipped when the phone asks for less motion. */
function confetti(from) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = from.getBoundingClientRect();
  for (let i = 0; i < 14; i++) {
    const c = el('span', 'confetti', ['✨', '⭐', '🎈', '🌈', '💫', '🎉', '🍭', '🦄'][i % 8]);
    const angle = Math.PI * (1.1 + Math.random() * 0.8);
    const dist = 70 + Math.random() * 90;
    c.style.left = `${r.left + r.width / 2}px`;
    c.style.top = `${r.top + r.height / 2}px`;
    c.style.setProperty('--dx', `${Math.cos(angle) * dist * 1.6}px`);
    c.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
    c.style.setProperty('--rot', `${Math.round(Math.random() * 360 - 180)}deg`);
    c.addEventListener('animationend', () => c.remove());
    setTimeout(() => c.remove(), 1500); // hidden tabs never fire animationend
    document.body.append(c);
  }
}

$('predict-prev').onclick = () => { hist().shown -= 1; showPredicted(); };
$('predict-next').onclick = () => { hist().shown += 1; showPredicted(); };

$('invent-go').onclick = async () => {
  const out = $('invent-out');
  const n = num('n', 1, 50, 10);
  const min = num('min', 3, 20, 5);
  const start = $('start').value.toLowerCase().replace(LETTERS[lang], '').slice(0, 10);
  busy(out, true);
  const { fresh, offline } = await onlyNew(
    engine.invent(n * 2, min, num('max', min, 24, 10), start, $('creativity').value), n);
  busy(out, false);
  render(out, fresh, t('inventEmpty'), false, offline ? t('offline') : '');
};

const coin = async () => {
  const out = $('coin-out');
  $('concept').blur();
  busy(out, true);
  const { fresh, offline } = await onlyNew(engine.coin($('concept').value.slice(0, 200), 24), 12);
  busy(out, false);
  render(out, fresh, t('coinEmpty'), false, offline ? t('offline') : '');
};
$('coin-go').onclick = coin;
$('concept').onkeydown = e => { if (e.key === 'Enter') coin(); };

const define = async () => {
  const out = $('define-out');
  const w = $('define-word').value.trim().toLowerCase().replace(LETTERS[lang], '').slice(0, 30);
  $('define-word').blur();
  if (!w) { render(out, [], t('defineEmpty')); return; }
  busy(out, true);
  const l = lang;
  const { exists, offline } = engine.isKnown(w) ? { exists: new Set([w]), offline: false } : await checkOnline([w], l);
  busy(out, false);
  if (exists.has(w)) {
    const li = el('li', 'hint', `${t('realWord').replace('{w}', w)} `);
    const link = el('a', '', t('lookUp'));
    link.href = `https://${l}.wiktionary.org/wiki/${encodeURIComponent(w)}`;
    link.target = '_blank';
    link.rel = 'noopener';
    li.append(link);
    out.replaceChildren(li);
    return;
  }
  const entry = { word: w, plausibility: engine.plausibility(w), ...engine.explain(w), lang: l };
  render(out, [entry], '', false, offline ? t('offline') : '');
};
$('define-go').onclick = define;
$('define-word').onkeydown = e => { if (e.key === 'Enter') define(); };

$('export').onclick = async () => {
  const json = JSON.stringify(saved, null, 2);
  const file = new File([json], 'predictionary.json', { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    await navigator.share({ files: [file] }).catch(() => {});
    return;
  }
  const a = el('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
  URL.revokeObjectURL(a.href);
};

const lines = file => fetch(file)
  .then(r => { if (!r.ok) throw new Error(`${file}: HTTP ${r.status}`); return r.text(); })
  .then(text => text.split('\n').filter(Boolean));

const engines = {}; // lang -> Promise<Predictionary>, built the first time that language is used
const memoryKey = l => `predictionary.memory.${l}`; // what was recently shown, so a new visit doesn't repeat it
function loadEngine(l) {
  engines[l] = engines[l] || Promise.all([...LISTS[l].map(lines), lines(`everyday-${l}.tsv`)])
    .then(lists => new Promise(resolve => setTimeout(() => resolve(lists), 30))) // let "Learning…" paint first
    .then(lists => {
      const everyday = lists.pop();
      const [words, common, train] = lists;
      const e = new Predictionary(words, common, l, train || words);
      e.addWords(everyday.map(row => row.split('\t')));
      e.addKnown(JSON.parse(localStorage.getItem(knownKey(l)) || '[]'));
      if (train) e.addKnown(train); // dictionary headwords count as existing words too
      try {
        const mem = JSON.parse(localStorage.getItem(memoryKey(l)) || '{}');
        for (const k of Object.keys(e.memory)) if (Array.isArray(mem[k])) e.memory[k] = mem[k].filter(s => typeof s === 'string');
      } catch { /* a damaged memory just starts fresh */ }
      return e;
    });
  return engines[l];
}

function applyStrings() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  $('concept').placeholder = t('conceptPh');
  $('define-word').placeholder = t('definePh');
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
}

async function setLang(l) {
  lang = l;
  localStorage.setItem(LANG_KEY, l);
  applyStrings();
  renderSaved();
  $('invent-out').replaceChildren();
  $('coin-out').replaceChildren();
  $('define-out').replaceChildren();
  showPredicted();
  document.querySelectorAll('button.go:not(#export)').forEach(b => { b.disabled = true; });
  updateSteps(true);
  const status = el('p', 'hint', t('loading'));
  status.id = 'status';
  const old = $('status');
  if (old) old.replaceWith(status);
  else $('tab-predict').before(status);
  try {
    const e = await loadEngine(l);
    if (lang !== l) return; // switched again while loading
    engine = e;
    status.remove();
    document.querySelectorAll('button.go').forEach(b => { b.disabled = false; });
    updateSteps();
  } catch (err) {
    status.textContent = t('loadError').replace('{e}', err.message);
  }
}

document.querySelectorAll('.lang button').forEach(b => { b.onclick = () => { if (b.dataset.lang !== lang) setLang(b.dataset.lang); }; });

function showStyle() {
  document.querySelectorAll('.styles button').forEach(b => b.classList.toggle('on', b.dataset.style === style));
}
document.querySelectorAll('.styles button').forEach(b => {
  b.onclick = () => { style = b.dataset.style; localStorage.setItem(STYLE_KEY, style); showStyle(); };
});
showStyle();
setLang(lang);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
